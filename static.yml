          alt="Fashion"
        >

        <div class="category-overlay">

          <h3>👕 Fashion</h3>

          <p>
            Trending clothes, shoes, bags and accessories.
          </p>

        </div>

      </a>


      <!-- HOME -->

      <a href="#products" class="category-card">

        <img
          src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=800&q=80"
          alt="Home and Living"
        >

        <div class="category-overlay">

          <h3>🏠 Home & Living</h3>

          <p>
            Useful products for your home and everyday life.
          </p>

        </div>

      </a>


      <!-- GAMING -->

      <a href="#products" class="category-card">

        <img
          src="https://images.unsplash.com/photo-1593305841991-05c297ba4575?auto=format&fit=crop&w=800&q=80"
          alt="Gaming"
        >

        <div class="category-overlay">

          <h3>🎮 Gaming</h3>

          <p>
            Consoles, accessories and gaming equipment.
          </p>

        </div>

      </a>

    </div>

  </section>


  <!-- FEATURED PRODUCTS -->

  <section class="container" id="products">

    <div class="section-title">

      <h2>🔥 Featured Products</h2>

      <p>
        A preview of the products we'll be featuring.
      </p>

    </div>


    <div class="products" id="productGrid">


      <!-- PRODUCT 1 -->

      <div class="product-card" data-name="wireless headphones">

