            alt="Wireless headphones"
          >

        </div>

        <div class="product-info">

          <div class="product-category">
            Gadgets
          </div>

          <h3>Wireless Headphones</h3>

          <div class="rating">
            ⭐⭐⭐⭐⭐
          </div>

          <div class="price">
            AED 99
          </div>

          <a href="#" class="shop-btn">
            Shop Now →
          </a>

        </div>

      </div>


      <!-- PRODUCT 2 -->

      <div class="product-card" data-name="fashion sneakers">

        <div class="product-image">

          <span class="tag">POPULAR</span>

          <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
            alt="Fashion sneakers"
          >

        </div>

        <div class="product-info">

          <div class="product-category">
            Fashion
          </div>

          <h3>Trending Sneakers</h3>

          <div class="rating">
            ⭐⭐⭐⭐⭐
          </div>

          <div class="price">
            AED 129
          </div>

          <a href="#" class="shop-btn">
            Shop Now →
          </a>

        </div>

      </div>


      <!-- PRODUCT 3 -->

      <div class="product-card" data-name="smart home">

        <div class="product-image">

          <span class="tag">NEW</span>

          <img
            src="https://images.unsplash.com/photo-1558008258-3256797b43f3?auto=format&fit=crop&w=800&q=80"
            alt="Smart home product"
