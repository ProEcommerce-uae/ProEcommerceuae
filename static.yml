            ⭐⭐⭐⭐⭐
          </div>

          <div class="price">
            AED 149
          </div>

          <a href="#" class="shop-btn">
            Shop Now →
          </a>

        </div>

      </div>


    </div>

  </section>


  <!-- FUTURE PRODUCTS -->

  <section class="future" id="future">

    <div class="container">

      <div class="future-content">

        <div class="future-icon">
          🚀
        </div>

        <h2>Future Products</h2>

        <p>
          We're constantly looking for exciting products and great
          deals to bring to ProEcommerce UAE. More categories and
          products are coming soon.
        </p>

        <div class="future-list">

          <span>⌚ Smart Watches</span>

          <span>🎧 Audio</span>

          <span>💻 Laptops</span>

          <span>📷 Cameras</span>

          <span>🏋️ Fitness</span>

          <span>🚗 Car Accessories</span>

          <span>💡 Smart Home</span>

          <span>🎮 Gaming</span>

        </div>

      </div>

    </div>

  </section>


  <!-- WHY PROECOMMERCE -->

  <section class="container">

    <div class="section-title">

      <h2>Why ProEcommerce?</h2>

      <p>
        Your place to discover products worth checking out.
      </p>

    </div>


    <div class="features">

      <div class="feature">

        <div class="feature-icon">
          🔎
        </div>

        <h3>Discover</h3>

        <p>
          Find interesting and trending products from different categories.
        </p>

      </div>


      <div class="feature">

        <div class="feature-icon">
          ⭐
        </div>

        <h3>Explore</h3>

        <p>
          Browse products and discover items that match your interests.
        </p>

      </div>


      <div class="feature">

        <div class="feature-icon">
          🛒
        </div>

        <h3>Shop</h3>

        <p>
          When available, we'll connect you to trusted shopping platforms.
        </p>

      </div>

    </div>

  </section>


  <!-- ABOUT -->

  <section class="about" id="about">

    <div class="container">

      <div class="about-grid">

        <div class="about-image">

          <img
            src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1000&q=80"
            alt="Online shopping"
          >

        </div>


        <div class="about-text">

          <h2>About ProEcommerce UAE</h2>

          <p>
            ProEcommerce UAE is a product discovery platform
            created to help shoppers find interesting products
            across popular categories.
          </p>

          <p>
            From gadgets and fashion to home products and gaming,
            our goal is to make discovering products simple,
            convenient and enjoyable.
          </p>

          <p>
            We are continuously expanding our product selection
            and will be adding more products in the future.
          </p>

          <a href="#products" class="btn btn-dark">
            Explore Products
          </a>

        </div>

      </div>

    </div>

  </section>


  <!-- NEWSLETTER -->

  <section class="newsletter">

    <div class="container">

      <div class="newsletter-content">

        <h2>Stay Updated 🚀</h2>

        <p>
          Get updates when new products and categories are added.
        </p>

        <form class="newsletter-form" onsubmit="subscribe(event)">

          <input
            type="email"
            placeholder="Enter your email address"
            required
          >

          <button class="btn btn-dark" type="submit">
            Subscribe
          </button>

        </form>

      </div>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <div class="footer-grid">


      <div>

        <h3>
          Pro<span style="color:#f59e0b;">Ecommerce</span> UAE
        </h3>

        <p>
          Discover trending products across gadgets, fashion,
          home & living and gaming.
        </p>

      </div>


      <div>

        <h3>Explore</h3>

        <a href="#home">Home</a>

        <a href="#categories">Categories</a>

        <a href="#products">Products</a>

        <a href="#future">Future Products</a>

      </div>


      <div>

        <h3>Categories</h3>

        <a href="#products">Gadgets</a>

        <a href="#products">Fashion</a>

        <a href="#products">Home & Living</a>

